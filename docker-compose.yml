services:
  mysql:
    image: mysql:8.0
    container_name: finpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: smart_office
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./smart-office-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./.docker/init-demo.sql:/docker-entrypoint-initdb.d/02-demo.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  whisper:
    build: ./faster-whisper-service
    image: finpilot-whisper:latest
    container_name: finpilot-whisper
    ports:
      - "${WHISPER_PORT:-8766}:8766"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8766/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - whisper_model_cache:/root/.cache/huggingface
    restart: unless-stopped

  backend:
    build: ./smart-office-backend
    image: finpilot-backend:latest
    container_name: finpilot-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_office?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
      FINPILOT_WHISPER_BASE_URL: http://whisper:8766
      FINPILOT_WHISPER_ENABLED: "true"
      # 工具调用编排模型端点；留空则 ChatModel 不装配，工具编排降级关闭
      FINPILOT_MODEL_BASE_URL: ${FINPILOT_MODEL_BASE_URL:-}
      FINPILOT_MODEL_API_KEY: ${FINPILOT_MODEL_API_KEY:-}
      FINPILOT_MODEL_NAME: ${FINPILOT_MODEL_NAME:-}
      # 本地知识文档检索（POST /api/knowledge/search-local）：只读平台上传的、当前用户有权限访问的文档。
      # 与上面的工具调用模型是两条独立通道，密钥可复用同一个。
      # BASE_URL 用 ${VAR-default} 而非 ${VAR:-default}：前者在「显式写成空值」时保留空串，
      # 从而真正关闭该模式（:- 会把空值当未设置、回落默认值，就关不掉了）。
      # 要整体关闭本地模式：在 .env 中写一行 FINPILOT_KB_MODEL_BASE_URL= 即可，Dify 路径不受影响。
      FINPILOT_KB_MODEL_BASE_URL: ${FINPILOT_KB_MODEL_BASE_URL-https://api.deepseek.com}
      FINPILOT_KB_MODEL_API_KEY: ${FINPILOT_KB_MODEL_API_KEY:-${DEEPSEEK_API_KEY:-}}
      FINPILOT_KB_MODEL_NAME: ${FINPILOT_KB_MODEL_NAME:-deepseek-chat}
      FINPILOT_KB_MODEL_MAX_CONTEXT_CHARS: ${FINPILOT_KB_MODEL_MAX_CONTEXT_CHARS:-30000}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai}
      DIFY_KB_API_KEY: ${DIFY_KB_API_KEY:-}
      DIFY_MEETING_API_KEY: ${DIFY_MEETING_API_KEY:-}
      DIFY_INSIGHT_API_KEY: ${DIFY_INSIGHT_API_KEY:-}
      DIFY_PPT_API_KEY: ${DIFY_PPT_API_KEY:-}
      DIFY_WRITER_API_KEY: ${DIFY_WRITER_API_KEY:-}
      DINGTALK_ENABLED: ${DINGTALK_ENABLED:-false}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_SECRET: ${DINGTALK_SECRET:-}
    volumes:
      - upload_data:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./smart-office-frontend
    image: finpilot-frontend:latest
    container_name: finpilot-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  mysql_data:
    name: finpilot_mysql_data
  upload_data:
    name: finpilot_upload_data
  whisper_model_cache:
    name: finpilot_whisper_model_cache
