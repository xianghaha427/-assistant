server:
  port: 8080

# 日志落文件便于排障（相对路径 logs/app.log，随启动目录生成）
logging:
  file:
    name: logs/app.log

spring:
  application:
    name: smart-office-backend
  datasource:
    url: jdbc:mysql://localhost:3306/smart_office?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    # 实体类字段统一以 snake_case 输出，与前端字段约定保持一致
    property-naming-strategy: SNAKE_CASE

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer

# Dify 云端配置（密钥存于数据库 agent_config.dify_app_id，不落代码文件）
dify:
  enabled: true
  base-url: https://api.dify.ai/v1
  api-key: ""

# DeepSeek 直连配置（三级降级第2级，Dify 不可用时启用）
# 密钥说明：git 全历史中从未配置过真实 key（自首个提交起 api-key 即为空）。
#   需用户自行前往 https://platform.deepseek.com/api_keys 创建密钥后填入下方 api-key；
#   为空时该级降级将 401 失败并自动落入第3级 Mock，不影响主流程。
deepseek:
  api-key: ""   # TODO 待用户提供：sk-xxxxxxxx（仓库历史无原 key）
  base-url: https://api.deepseek.com
  model: deepseek-chat
  enabled: true

# 文件上传目录
app:
  upload-path: ./uploads

dingtalk:
  enabled: false
  webhook-url: ""
  secret: ""
