server:
  port: 8080

# 日志落文件便于排障（相对路径 logs/app.log，随启动目录生成）
logging:
  file:
    name: logs/app.log

spring:
  application:
    name: smart-office-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/smart_office?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    # 实体类字段统一以 snake_case 输出，与前端字段约定保持一致
    property-naming-strategy: SNAKE_CASE

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer

# Dify 云端配置（密钥由本机环境变量注入数据库，不写入代码仓库）
dify:
  enabled: true
  base-url: ${DIFY_BASE_URL:https://api.dify.ai}
  app-keys:
    knowledge: ${DIFY_KB_API_KEY:}
    meeting: ${DIFY_MEETING_API_KEY:}
    insight: ${DIFY_INSIGHT_API_KEY:}
    ppt: ${DIFY_PPT_API_KEY:}
    writer: ${DIFY_WRITER_API_KEY:}

# 文件上传目录
app:
  upload-path: ./uploads

dingtalk:
  enabled: ${DINGTALK_ENABLED:false}
  webhook-url: ${DINGTALK_WEBHOOK_URL:}
  secret: ${DINGTALK_SECRET:}

finpilot:
  # ---- 工具调用编排模型（OpenAI 兼容端点，供 POST /api/ai/agent-exec 使用）----
  # 端点由 FINPILOT_MODEL_BASE_URL / _API_KEY / _NAME 环境变量提供。
  # base-url 刻意不在此声明：未配置时 LangChain4jConfig 整体不装配，工具编排降级关闭。
  model:
    timeout-seconds: 120
  # ---- 本地知识文档检索模型（POST /api/knowledge/search-local）----
  # 与上面的 model 完全独立：那条线供工具调用编排（@Tool）使用，这条线只做
  # 「按权限取本地文档 → 交给长上下文模型作答」，两条线互不感知。
  # base-url / api-key 与上面同理，刻意不在本文件声明：为空即本地模式整体关闭，
  # 前端「本地文档」开关置灰，Dify 路径不受任何影响。
  kb-model:
    model-name: ${FINPILOT_KB_MODEL_NAME:deepseek-chat}
    max-context-chars: ${FINPILOT_KB_MODEL_MAX_CONTEXT_CHARS:30000}
    timeout-seconds: 60
  # ---- 语音转写（Faster-Whisper Python 微服务）----
  whisper:
    enabled: true                       # 未启动微服务时关闭
    base-url: http://localhost:8766
