server:
  port: 8080

# 日志落文件便于排障（相对路径 logs/app.log，随启动目录生成）
logging:
  file:
    name: logs/app.log

spring:
  application:
    name: smart-office-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/smart_office?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    # 实体类字段统一以 snake_case 输出，与前端字段约定保持一致
    property-naming-strategy: SNAKE_CASE

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer

# Dify 云端配置（密钥存于数据库 agent_config.dify_app_id，不落代码文件）
dify:
  enabled: true
  base-url: https://api.dify.ai/v1
  api-key: ""

# 文件上传目录
app:
  upload-path: ./uploads

dingtalk:
  enabled: true
  webhook-url: "https://oapi.dingtalk.com/robot/send?access_token=b0900c627ca57bc491dd435598e50a3310a9dd09802fa382b097b6aa4a3aed81"
  secret: ""

# ---- 阶段1：FinPilot 自研知识引擎开关（LangChain4j 双通道）----
# enabled=true 装配自研引擎 Bean；知识问答是否走自研由 agent_config#1 engine 列决定，
# 自研异常时自动回落 Dify 链路。
finpilot:
  engine:
    enabled: true
    timeout-seconds: 120
  # ---- 阶段2：自建 RAG 检索引擎（Ollama Embedding + 内存向量索引）----
  # 知识问答 engine=native 时优先走自研 RAG（检索+生成），Ollama 不可用时自动退化为纯 LLM 模式。
  rag:
    ollama-base-url: http://localhost:11434
    embedding-model: nomic-embed-text   # Ollama 拉取: ollama pull nomic-embed-text
    local-model: qwen2.5:latest         # 本地安全通道模型
    docs-path: ../knowledge-docs        # 知识库文档目录（相对于 smart-office-backend 工作目录）
    top-k: 4                            # 检索返回片段数
  # ---- 阶段3：语音转写（Faster-Whisper Python 微服务）----
  whisper:
    enabled: true                       # 未启动微服务时关闭
    base-url: http://localhost:8766
