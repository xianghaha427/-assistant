      # ==================== 9. 代码 图表校验与组装 ====================
      - data:
          code: |-
            # =====================================================================
            # 图表校验与组装节点：容错解析图表 LLM 输出的 JSON，严格校验后
            # 组装 ECharts option 并包成 ```echarts 代码块；校验失败降级。
            # 输入: chart_text —— LLM「图表数据提取」的输出（允许 None/空值）
            # 输出:
            #   chart_md —— ```echarts 代码块（失败时为 ""）
            #   ok       —— True / False
            # =====================================================================
            import json
            import re


            def main(chart_text) -> dict:
                # 入口防御：None/空串/纯空白/非字符串 → 直接降级，绝不抛异常
                fail = {"chart_md": "", "ok": False}
                if not chart_text or not str(chart_text).strip():
                    return fail
                try:
                    text = str(chart_text).strip()

                    # ---------- 容错解析：直接解析 → 代码块提取 → 正则提取 {...} ----------
                    parsed = None
                    try:
                        parsed = json.loads(text)
                    except Exception:
                        parsed = None
                    if parsed is None:
                        m = re.search(r"```[a-zA-Z]*\s*(\{[\s\S]*?\})\s*```", text)
                        if m:
                            try:
                                parsed = json.loads(m.group(1))
                            except Exception:
                                parsed = None
                    if parsed is None:
                        m = re.search(r"\{[\s\S]*\}", text)
                        if m:
                            try:
                                parsed = json.loads(m.group(0))
                            except Exception:
                                parsed = None
                    if not isinstance(parsed, dict):
                        return fail

                    # ---------- 字段校验 ----------
                    categories = parsed.get("categories")
                    data = parsed.get("data")
                    chart_type = str(parsed.get("chart_type") or "").strip().lower()
                    title = str(parsed.get("title") or "").strip()

                    if not isinstance(categories, list) or not categories:
                        return fail
                    if not isinstance(data, list) or not data:
                        return fail
                    if len(categories) != len(data):
                        return fail
                    if chart_type not in ("bar", "line", "pie"):
                        return fail

                    # data 元素必须可转数字
                    nums = []
                    for v in data:
                        try:
                            nums.append(float(v))
                        except Exception:
                            return fail

                    cats = [str(c) for c in categories]
                    if not title:
                        title = "图表数据（示例数据）"

                    # ---------- 通用规范：极光主题配色 + 标题/副标题 + 动画 ----------
                    palette = [
                        "#4D8DFF", "#8B5CF6", "#22D3EE", "#34D399",
                        "#FBBF24", "#F87171", "#94A3B8",
                    ]
                    title_conf = {
                        "text": title,
                        "subtext": "数据来源：示例数据",
                        "left": "center",
                        "textStyle": {"fontSize": 15, "fontWeight": 600},
                        "subtextStyle": {"fontSize": 11, "color": "#9CA3AF"},
                    }

                    # ---------- 按 chart_type 组装 ECharts option ----------
                    if chart_type == "pie":
                        # 类目较多时标签只显示百分比，类目名由底部图例承担
                        label_formatter = "{d}%" if len(cats) > 5 else "{b}\n{d}%"
                        option = {
                            "color": palette,
                            "title": title_conf,
                            "tooltip": {
                                "trigger": "item",
                                "formatter": "{b}：{c}（{d}%）",
                            },
                            "legend": {"bottom": 0, "type": "scroll"},
                            "animationDuration": 600,
                            "series": [
                                {
                                    "type": "pie",
                                    "radius": ["42%", "68%"],
                                    "center": ["50%", "55%"],
                                    "data": [
                                        {"name": cats[i], "value": nums[i]}
                                        for i in range(len(cats))
                                    ],
                                    "itemStyle": {
                                        "borderRadius": 6,
                                        "borderColor": "#fff",
                                        "borderWidth": 2,
                                    },
                                    "label": {
                                        "formatter": label_formatter,
                                        "fontSize": 12,
                                        "lineHeight": 18,
                                    },
                                    "labelLine": {"length": 16, "length2": 12},
                                }
                            ],
                        }
                    else:
                        option = {
                            "color": palette,
                            "title": title_conf,
                            "tooltip": {"trigger": "axis"},
                            "grid": {
                                "left": "6%",
                                "right": "8%",
                                "top": 70,
                                "bottom": 50,
                                "containLabel": True,
                            },
                            "animationDuration": 600,
                            "xAxis": {
                                "type": "category",
                                "data": cats,
                                "axisLabel": {
                                    "interval": 0,
                                    "rotate": 30 if len(cats) > 4 else 0,
                                },
                            },
                            "yAxis": {
                                "type": "value",
                                "splitLine": {"lineStyle": {"type": "dashed"}},
                            },
                        }
                        if chart_type == "bar":
                            option["series"] = [
                                {
                                    "type": "bar",
                                    "data": nums,
                                    "barMaxWidth": 45,
                                    "itemStyle": {"borderRadius": [6, 6, 0, 0]},
                                    "label": {"show": True, "position": "top", "fontSize": 11},
                                }
                            ]
                        else:
                            option["series"] = [
                                {
                                    "type": "line",
                                    "data": nums,
                                    "smooth": True,
                                    "symbolSize": 8,
                                    "areaStyle": {"opacity": 0.12},
                                    "label": {"show": True, "fontSize": 11},
                                }
                            ]

                    chart_md = "```echarts\n" + json.dumps(option, ensure_ascii=False) + "\n```"
                    return {"chart_md": chart_md, "ok": True}
                except Exception:
                    # 任何意外异常（类型转换/索引访问/序列化）都降级，绝不抛到 Dify 运行时
                    return fail
          code_language: python3
          desc: 容错解析图表 JSON，校验并组装 ECharts 代码块
          outputs:
            chart_md:
              children: null
              type: string
            ok:
              children: null
              type: boolean
          title: 图表校验与组装
          type: code
          variables:
            - value_selector:
                - '1754500000008'
                - text
              variable: chart_text
        height: 54
        id: '1754500000009'
        position:
          x: 1904
          y: 180
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
