# =====================================================================
# 恒生智能办公助手 - 行业洞察助手 DSL（ChatFlow 完整编排版）
# 用途：金融行业深度分析问答，自动判断并生成 ECharts 可视化图表
# 类型：Chatflow（advanced-chat 对话型工作流），目标平台 Dify 1.16.1
# 底层模型：deepseek-chat（provider: deepseek）
#
# 工作流结构：
#   开始(sys.query) → 问题分类器
#     ├─ 类1 问候与闲聊 → 直接回复[闲聊应答]（固定文案，不调LLM）
#     ├─ 类3 超范围问题 → 直接回复[兜底应答]（固定文案，说明能力边界）
#     └─ 类2 行业洞察分析 → LLM[洞察分析] → 代码[报告清洗] → 条件分支1
#           ├─ need_chart=true → LLM[图表数据提取] → 代码[图表校验与组装] → 条件分支2
#           │     ├─ ok=true  → 直接回复[带图表]（报告+echarts代码块）
#           │     └─ ok=false → 直接回复[无图表]（仅报告）
#           └─ need_chart=false → 直接回复[无图表]（仅报告）
#
# v2.0 重构说明（针对 v1.x 三个实测问题的修复）：
#   1. 问候语走完整分析流程 → 新增「问题分类器」节点，闲聊/超范围问题
#      直接固定文案应答，绝不进入分析链路；
#   2. 残缺 echarts JSON 裸露给用户 → 图表数据由代码节点做容错解析与
#      结构校验，校验失败降级为纯文本报告，任何节点都不输出原始 JSON；
#   3. 双 LLM 冗余无逻辑 → 合并为单一主分析节点（六段式专业骨架），
#      图表数据提取拆为独立的轻量短节点，职责单一、成本可控。
#
# v2.1 修复说明（针对导入后实测「条件分支2 处 Expecting value: line 1 column 1」报错）：
#   1. 硬化「图表校验与组装」代码节点：main 入口先做 None/空串/纯空白/非字符串
#      防御（str(chart_text) 后再 strip），整个解析-校验-组装全流程包在
#      try/except 中，任何异常（json.loads、类型转换、索引访问）一律降级为
#      {"chart_md": "", "ok": false}，绝不向 Dify 运行时抛异常；
#   2. 同样硬化「报告清洗」代码节点：输入为空/None 时返回
#      {"report_clean": "", "need_chart": "false"}，全流程 try/except 包裹；
#   3. 修复条件分支2 的布尔条件：原配置 varType: boolean + comparison_operator: is
#      + value: ''，Dify 后端对布尔条件按 json.loads(value) 解析，空串直接触发
#      "Expecting value: line 1 column 1 (char 0)"。改为 value: 'true' 后恢复正常。
#
# v2.2 图表排版优化说明（针对用户反馈“图表排版太挤”）：
#   仅修改「图表校验与组装」代码节点的 ECharts option 组装逻辑（三级容错解析、
#   字段校验、chart_md/ok 输出契约、```echarts 包裹方式均不变）：
#   1. 统一 恒生智能办公助手 极光主题专业配色与 grid 边距，标题居中 + 副标题
#      “数据来源：示例数据”（灰色小字）标注数据属性，动画 600ms；
#   2. 柱状图：barMaxWidth 45 + 顶部圆角 + 数值标签，类目>4 时 X 轴标签
#      旋转 30°，Y 轴虚线分隔且不设死上限；
#   3. 折线图：平滑曲线 + symbolSize 8 + 区域渐变填充（opacity 0.12）；
#   4. 饼图改环形（radius ['42%','68%']、center ['50%','55%']），外侧标签带
#      引导线，扇区白边分隔，图例底部水平滚动；类目>5 时标签只显示百分比，
#      类目名由图例承担。
#
# v2.3 统一走 Dify 说明：平台所有智能体仅接 Dify（不再暴露 DeepSeek 直连 /
#   其他通道选项），本 Chatflow 底层模型保持 deepseek-chat；图表能力不变
#   （饼图/柱状图/折线图），并补充「季度趋势折线图」提取示例与建议问题，
#   覆盖“保险金季度图”等时序类需求。
#
# v2.4 图表兜底修复：图表判断不再只依赖「洞察分析」LLM 输出的 <need_chart> 标记，
#   在「报告清洗」代码节点增加用户问题关键词兜底（图/趋势/占比/季度/对比/饼/柱等），
#   命中即强制 need_chart=true，避免 LLM 未输出标记导致永远走「无图表输出」分支。
#
# 设计原则（参考 Wind Alice / Bloomberg / AlphaSense 等成熟产品）：
#   - 闲聊绝不进分析链路
#   - 结论与图表成对交付
#   - 无外部数据源时强制标注数据属性（【示例数据】/【行业普遍情况】）
#   - 永不向用户裸露 JSON
#
# 导入方式：Dify 工作室 → 创建应用 → 导入 DSL 文件
# =====================================================================
app:
  description: >-
    恒生智能办公助手 行业洞察助手，资深金融行业分析师角色，专注宏观政策与银行/证券/保险行业动态的深度分析，
    内置问题分类、防虚构数据约束，并可自动将对比/趋势/占比类分析渲染为 ECharts 交互图表。
  icon: "📈"
  icon_background: '#FFF4E5'
  mode: advanced-chat
  name: 行业洞察助手
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: 您好！我是 恒生智能办公助手 行业洞察助手，可以为您深度分析宏观政策与金融行业动态，并自动生成可视化图表。请输入您关注的行业分析问题。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 分析利率下行对银行净息差的影响
      - 对比各大银行零售业务转型进展
      - 当前保险市场保费收入结构占比如何？
      - 保险业保费收入季度变化趋势（生成折线图）
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      # 开始 → 问题分类器
      - data:
          isInIteration: false
          sourceType: start
          targetType: question-classifier
        id: edge-start-to-classifier
        source: '1754500000001'
        sourceHandle: source
        target: '1754500000002'
        targetHandle: target
        type: custom
      # 问题分类器 类1（问候与闲聊） → 直接回复[闲聊应答]
      - data:
          isInIteration: false
          sourceHandle: '1'
          sourceType: question-classifier
          targetType: answer
        id: edge-classifier-class1-to-chitchat
        source: '1754500000002'
        sourceHandle: '1'
        target: '1754500000003'
        targetHandle: target
        type: custom
      # 问题分类器 类3（超范围问题） → 直接回复[兜底应答]
      - data:
          isInIteration: false
          sourceHandle: '3'
          sourceType: question-classifier
          targetType: answer
        id: edge-classifier-class3-to-fallback
        source: '1754500000002'
        sourceHandle: '3'
        target: '1754500000004'
        targetHandle: target
        type: custom
      # 问题分类器 类2（行业洞察分析） → LLM[洞察分析]
      - data:
          isInIteration: false
          sourceHandle: '2'
          sourceType: question-classifier
          targetType: llm
        id: edge-classifier-class2-to-insight
        source: '1754500000002'
        sourceHandle: '2'
        target: '1754500000005'
        targetHandle: target
        type: custom
      # LLM[洞察分析] → 代码[报告清洗]
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: edge-insight-to-clean
        source: '1754500000005'
        sourceHandle: source
        target: '1754500000006'
        targetHandle: target
        type: custom
      # 代码[报告清洗] → 条件分支1
      - data:
          isInIteration: false
          sourceType: code
          targetType: if-else
        id: edge-clean-to-branch1
        source: '1754500000006'
        sourceHandle: source
        target: '1754500000007'
        targetHandle: target
        type: custom
      # 条件分支1 CASE need_chart=true → LLM[图表数据提取]
      - data:
          isInIteration: false
          sourceHandle: 'true'
          sourceType: if-else
          targetType: llm
        id: edge-branch1-true-to-chart-llm
        source: '1754500000007'
        sourceHandle: 'true'
        target: '1754500000008'
        targetHandle: target
        type: custom
      # 条件分支1 ELSE → 直接回复[无图表]
      - data:
          isInIteration: false
          sourceHandle: 'false'
          sourceType: if-else
          targetType: answer
        id: edge-branch1-false-to-answer-nochart
        source: '1754500000007'
        sourceHandle: 'false'
        target: '1754500000012'
        targetHandle: target
        type: custom
      # LLM[图表数据提取] → 代码[图表校验与组装]
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: edge-chart-llm-to-assemble
        source: '1754500000008'
        sourceHandle: source
        target: '1754500000009'
        targetHandle: target
        type: custom
      # 代码[图表校验与组装] → 条件分支2
      - data:
          isInIteration: false
          sourceType: code
          targetType: if-else
        id: edge-assemble-to-branch2
        source: '1754500000009'
        sourceHandle: source
        target: '1754500000010'
        targetHandle: target
        type: custom
      # 条件分支2 CASE ok=true → 直接回复[带图表]
      - data:
          isInIteration: false
          sourceHandle: 'true'
          sourceType: if-else
          targetType: answer
        id: edge-branch2-true-to-answer-chart
        source: '1754500000010'
        sourceHandle: 'true'
        target: '1754500000011'
        targetHandle: target
        type: custom
      # 条件分支2 ELSE → 直接回复[无图表]（降级，仅报告）
      - data:
          isInIteration: false
          sourceHandle: 'false'
          sourceType: if-else
          targetType: answer
        id: edge-branch2-false-to-answer-nochart
        source: '1754500000010'
        sourceHandle: 'false'
        target: '1754500000012'
        targetHandle: target
        type: custom
    nodes:
      # ==================== 1. 开始（ChatFlow 不定义表单变量） ====================
      - data:
          desc: 用户输入入口，用户提问内容走系统变量 sys.query
          title: 开始
          type: start
          variables: []
        height: 54
        id: '1754500000001'
        position:
          x: 80
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 2. 问题分类器 ====================
      - data:
          classes:
            - id: '1'
              name: 问候与闲聊
            - id: '2'
              name: 行业洞察分析
            - id: '3'
              name: 超范围问题
          desc: 三分类路由：闲聊直接应答 / 进入分析链路 / 超范围兜底
          instruction: |-
            你是金融行业智能助手的问题分类器，请根据用户输入及最近对话上下文，将用户最新意图归入以下三类之一：

            【类1 问候与闲聊】打招呼、感谢、告别、自我介绍、无实质问题的寒暄。
            排除条件：只要用户话语中包含任何行业/业务分析请求，即使带有问候语，也不属于本类。
            示例：
            - 「你好」→ 类1
            - 「谢谢，下次再聊」→ 类1

            【类2 行业洞察分析】涉及金融、行业、政策、机构经营的分析、对比、趋势、占比类问题。包括但不限于：宏观政策（利率、降准降息、监管政策）、银行/证券/保险/基金行业动态、机构业务对比、市场结构占比、发展趋势研判。
            示例：
            - 「分析一下利率下行对银行净息差的影响」→ 类2
            - 「当前保险市场保费收入结构占比如何？」→ 类2

            【类3 超范围问题】与金融行业分析无关的编程、写作、生活、娱乐类问题。
            示例：
            - 「帮我写一段 Python 爬虫代码」→ 类3
            - 「推荐几部周末看的电影」→ 类3

            分类优先级：含明确分析诉求 → 类2；否则为纯寒暄/礼貌语 → 类1；其余 → 类3。
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: deepseek-chat
            provider: deepseek
          query_variable_selector:
            - sys
            - query
          title: 问题分类器
          type: question-classifier
        height: 90
        id: '1754500000002'
        position:
          x: 384
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 3. 直接回复 闲聊应答（固定文案，不调LLM） ====================
      - data:
          answer: |-
            您好！我是 恒生智能办公助手 行业洞察助手，专注金融行业的深度分析与可视化。您可以试试：

            1. 分析利率下行对银行净息差的影响
            2. 对比各大银行零售业务转型进展
            3. 当前保险市场保费收入结构占比如何？
          desc: 问候与闲聊的固定应答，不进入分析链路
          title: 闲聊应答
          type: answer
        height: 105
        id: '1754500000003'
        position:
          x: 688
          y: 80
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 4. 直接回复 兜底应答（固定文案） ====================
      - data:
          answer: |-
            我是 恒生智能办公助手 行业洞察助手，专注金融行业洞察领域：

            - 宏观政策解读（利率、降准降息、监管政策等）
            - 银行/证券/保险行业动态分析
            - 机构经营对比与市场结构占比研判

            您这个问题超出了我的专业范围，暂无法提供有效帮助。欢迎回到上述领域提问，例如：「分析近期央行降准对银行业的影响」。
          desc: 超范围问题的固定兜底应答，引导回可问的问题类型
          title: 兜底应答
          type: answer
        height: 105
        id: '1754500000004'
        position:
          x: 688
          y: 480
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 5. LLM 洞察分析（唯一主分析节点） ====================
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 六段式专业骨架深度分析，内置防虚构数据硬约束
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0.5
              max_tokens: 4096
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: prompt-insight-system
              role: system
              text: |-
                你是一名资深金融行业分析师（恒生智能办公助手 行业洞察助手），擅长宏观政策、银行、证券、保险、基金等金融行业的深度分析。请针对用户的行业分析问题，严格按以下六段式专业骨架输出 Markdown 正文：

                一、核心结论（1-3句先行观点）
                二、宏观与行业背景（政策/周期/驱动因素）
                三、影响分析（对金融机构业务的机会与挑战，分点）
                四、机构应对建议（可落地动作）
                五、风险提示（含反向情形）
                六、数据说明

                【防虚构硬约束】
                1. 所有量化数据必须标注【示例数据】或【行业普遍情况】；
                2. 无把握的数据优先给区间/量级，禁止编造精确数值；
                3. 当问题含对比/趋势/占比/图表等语义时，正文中必须给出【示例数据】的具体数值（如"约1.2万亿""75%""Q1 320亿元"），供后续图表生成，并标注【示例数据】；
                4. 末尾固定一行：分析基于模型知识，不构成投资建议。

                【图表判断】
                回答的最后单独一行输出图表判断标记：
                - 当问题含对比/趋势/占比语义，且正文中已给出≥2个可量化类目时，输出：<need_chart>true</need_chart>
                - 否则输出：<need_chart>false</need_chart>

                【格式要求】
                - 正文用 Markdown，结构清晰，使用标题与分点；
                - 不要在正文里输出任何 JSON 或其他机器格式数据。
            - id: prompt-insight-user
              role: user
              text: |-
                行业分析问题：{{#sys.query#}}
          selected_features: []
          title: 洞察分析
          type: llm
          vision:
            enabled: false
        height: 98
        id: '1754500000005'
        position:
          x: 688
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 6. 代码 报告清洗（剥离 need_chart 标记） ====================
      - data:
          code: |-
            # =====================================================================
            # 报告清洗节点：从分析 LLM 输出中提取图表判断标记并剥离标记行，
            # 保证用户看到的报告正文中不含任何内部控制标记。
            # 输入: llm_text —— LLM「洞察分析」的完整输出
            #       user_query —— 用户原始提问（sys.query），用于图表关键词兜底
            # 输出:
            #   report_clean —— 剥离标记后的干净 Markdown 报告
            #   need_chart   —— "true" / "false"（默认 "false"）
            # =====================================================================
            import re


            def main(llm_text, user_query=None) -> dict:
                # 入口防御：None/空串/纯空白/非字符串均安全降级，绝不抛异常
                default_out = {"report_clean": "", "need_chart": "false"}
                try:
                    if llm_text is None or not str(llm_text).strip():
                        return default_out
                    text = str(llm_text)

                    # 提取 need_chart 标记（大小写不敏感，取最后一次输出为准）
                    marks = re.findall(
                        r"<need_chart>\s*(true|false)\s*</need_chart>",
                        text,
                        re.IGNORECASE,
                    )
                    need_chart = marks[-1].lower() if marks else "false"

                    # 关键词兜底：用户明显要图表（图/趋势/占比/季度等）时，
                    # 即使 LLM 没输出标记也强制 need_chart=true
                    if need_chart == "false" and user_query:
                        chart_keywords = (
                            "图", "图表", "趋势", "走势", "占比", "比例", "结构",
                            "分布", "对比", "排行", "份额", "季度", "月度", "年度",
                            "饼", "柱", "折线",
                        )
                        q = str(user_query)
                        if any(k in q for k in chart_keywords):
                            need_chart = "true"

                    # 从正文中剥离标记行（含整行残留的空白）
                    report_clean = re.sub(
                        r"[ \t]*<need_chart>\s*(?:true|false)\s*</need_chart>[ \t]*\r?\n?",
                        "",
                        text,
                        flags=re.IGNORECASE,
                    )
                    report_clean = report_clean.strip()

                    return {
                        "report_clean": report_clean,
                        "need_chart": need_chart,
                    }
                except Exception:
                    # 任何意外异常都降级为安全默认值，绝不抛到 Dify 运行时
                    return default_out
          code_language: python3
