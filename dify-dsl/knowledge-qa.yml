# =====================================================================
# 恒生智能办公助手 - 企业知识问答助手 DSL（v2.0 语义分类优化版）
# 用途：金融企业员工内部知识问答，覆盖公司制度、流程规范、业务操作等场景
# 类型：Chatflow（advanced-chat 对话型工作流），目标平台 Dify 1.16.1
# 底层模型：deepseek-chat（provider: deepseek）
#
# v2.0 优化说明（相对 v1.x 的 code 短语匹配意图识别）：
#   1. 意图识别由「code 节点短语匹配」改为「question-classifier 语义分类」，
#      能理解自然语言表达（如"帮我查下请假流程""找 IT 看下账号"），
#      不再依赖脆弱的硬编码短语列表，漏判/误判率大幅下降；
#   2. 去除 code 节点的 type 输出变量名（易与节点类型字段混淆）与
#      if-else 的 in 操作符（Dify 不支持）隐患；
#   3. 分类精简为三路：问候闲聊 / 转人工 / 知识问答，其中问候与转人工
#      走固定文案应答（不调 LLM），知识问答走 RAG 检索 + 结构化回答。
#
# 工作流结构：
#   开始(sys.query) → 问题分类器（语义三分类）
#     ├─ 类1 问候与闲聊 → 直接回复[问候应答]（固定文案，不调LLM）
#     ├─ 类2 转人工服务 → 直接回复[转人工应答]（固定文案）
#     └─ 类3 知识问答 → 知识检索 → 条件分支
#           ├─ 检索结果非空 → LLM[RAG回答] → 直接回复（终端）
#           └─ 检索结果为空 → LLM[闲聊兜底] → 直接回复（终端）
#
# 导入方式：Dify 工作室 → 创建应用 → 导入 DSL 文件
# 重要：导入后必须在「知识检索」节点中绑定实际的企业知识库
# =====================================================================
app:
  description: >-
    恒生智能办公助手 企业知识问答助手，专为金融企业员工提供公司制度、流程规范、业务操作等方面的智能问答服务。内置语义意图识别（问候闲聊/转人工/知识问答），基于企业知识库进行 RAG 精准回答，知识库未命中时提供闲聊兜底。
  icon: "📚"
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 企业知识问答助手
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: 您好！我是 恒生智能办公助手 企业知识问答助手，可以为您解答公司制度、流程规范、业务操作等问题。请问有什么可以帮您？
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 公司的请假流程是什么？
      - 报销制度有哪些要求？
      - 新员工入职需要哪些手续？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      # 开始 → 问题分类器
      - data:
          isInIteration: false
          sourceType: start
          targetType: question-classifier
        id: edge-start-to-classifier
        source: '1754600000001'
        sourceHandle: source
        target: '1754600000002'
        targetHandle: target
        type: custom
      # 问题分类器 类1（问候与闲聊） → 直接回复[问候应答]
      - data:
          isInIteration: false
          sourceHandle: '1'
          sourceType: question-classifier
          targetType: answer
        id: edge-classifier-class1-to-greeting
        source: '1754600000002'
        sourceHandle: '1'
        target: '1754600000003'
        targetHandle: target
        type: custom
      # 问题分类器 类2（转人工服务） → 直接回复[转人工应答]
      - data:
          isInIteration: false
          sourceHandle: '2'
          sourceType: question-classifier
          targetType: answer
        id: edge-classifier-class2-to-human
        source: '1754600000002'
        sourceHandle: '2'
        target: '1754600000004'
        targetHandle: target
        type: custom
      # 问题分类器 类3（知识问答） → 知识检索
      - data:
          isInIteration: false
          sourceHandle: '3'
          sourceType: question-classifier
          targetType: knowledge-retrieval
        id: edge-classifier-class3-to-retrieval
        source: '1754600000002'
        sourceHandle: '3'
        target: '1754600000005'
        targetHandle: target
        type: custom
      # 知识检索 → 条件分支
      - data:
          isInIteration: false
          sourceType: knowledge-retrieval
          targetType: if-else
        id: edge-retrieval-to-branch
        source: '1754600000005'
        sourceHandle: source
        target: '1754600000006'
        targetHandle: target
        type: custom
      # 条件分支 true（检索非空） → LLM[RAG回答]
      - data:
          isInIteration: false
          sourceHandle: 'true'
          sourceType: if-else
          targetType: llm
        id: edge-branch-true-to-rag
        source: '1754600000006'
        sourceHandle: 'true'
        target: '1754600000007'
        targetHandle: target
        type: custom
      # 条件分支 false（检索为空） → LLM[闲聊兜底]
      - data:
          isInIteration: false
          sourceHandle: 'false'
          sourceType: if-else
          targetType: llm
        id: edge-branch-false-to-chitchat
        source: '1754600000006'
        sourceHandle: 'false'
        target: '1754600000008'
        targetHandle: target
        type: custom
      # LLM[RAG回答] → 直接回复
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: edge-rag-to-answer
        source: '1754600000007'
        sourceHandle: source
        target: '1754600000009'
        targetHandle: target
        type: custom
      # LLM[闲聊兜底] → 直接回复
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: edge-chitchat-to-answer
        source: '1754600000008'
        sourceHandle: source
        target: '1754600000010'
        targetHandle: target
        type: custom
    nodes:
      # ==================== 1. 开始 ====================
      - data:
          desc: 用户输入入口，用户提问内容走系统变量 sys.query
          title: 开始
          type: start
          variables: []
        height: 54
        id: '1754600000001'
        position:
          x: 80
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 2. 问题分类器（语义三分类） ====================
      - data:
          classes:
            - id: '1'
              name: 问候与闲聊
            - id: '2'
              name: 转人工服务
            - id: '3'
              name: 知识问答
          desc: 语义三分类路由：问候闲聊/转人工走固定应答，知识问答走 RAG 检索
          instruction: |-
            你是「恒生智能办公助手 企业知识问答助手」的意图分类器。请根据用户输入及最近对话上下文，将用户最新意图归入以下三类之一：

            【类1 问候与闲聊】打招呼、感谢、告别、自我介绍、无实质问题的寒暄。
            示例：
            - 「你好」→ 类1
            - 「谢谢，下次再聊」→ 类1
            - 「你是谁 / 你能做什么」→ 类1

            【类2 转人工服务】明确要求转接人工、联系管理员/IT/技术部，或反馈系统故障、账号问题、投诉建议等需要人工介入的诉求。
            示例：
            - 「转人工」→ 类2
            - 「我的账号登录不上，找 IT 看下」→ 类2
            - 「我要投诉」→ 类2

            【类3 知识问答】咨询公司制度、流程规范、业务操作等企业知识问题。
            示例：
            - 「差旅报销标准是什么？」→ 类3
            - 「请假流程怎么走？」→ 类3

            分类优先级：含明确人工介入/系统故障/投诉诉求 → 类2；含制度/流程/业务知识咨询 → 类3；纯寒暄或礼貌语 → 类1；无法归入前两类的其余输入 → 类3（默认走知识问答）。
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: deepseek-chat
            provider: deepseek
          query_variable_selector:
            - sys
            - query
          title: 问题分类器
          type: question-classifier
        height: 90
        id: '1754600000002'
        position:
          x: 384
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 3. 直接回复 问候应答（固定文案） ====================
      - data:
          answer: |-
            您好！我是 恒生智能办公助手 企业知识问答助手，可以为您解答公司制度、流程规范、业务操作等问题。请问有什么可以帮您？
          desc: 问候与闲聊的固定应答，不进入知识检索链路
          title: 问候应答
          type: answer
        height: 105
        id: '1754600000003'
        position:
          x: 688
          y: 80
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 4. 直接回复 转人工应答（固定文案） ====================
      - data:
          answer: |-
            已为您转接人工服务通道。如需帮助，请联系行政部或 IT 支持（分机 8000），或通过企业办公系统提交工单，相关同事会尽快与您联系。
          desc: 转人工/系统故障/投诉等诉求的固定应答
          title: 转人工应答
          type: answer
        height: 105
        id: '1754600000004'
        position:
          x: 688
          y: 480
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 5. 知识检索 ====================
      - data:
          dataset_ids: []
          desc: 从企业知识库中检索相关制度、流程、规范内容（导入后请绑定知识库）
          multiple_retrieval_config:
            reranking_model: null
            top_k: 4
            score_threshold_enabled: false
          query_variable_selector:
            - sys
            - query
          retrieval_mode: multiple
          title: 知识检索
          type: knowledge-retrieval
        height: 90
        id: '1754600000005'
        position:
          x: 992
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 6. 条件分支 检索结果是否为空 ====================
      - data:
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: not empty
                  id: cond-retrieval-nonempty
                  value: ''
                  varType: array[object]
                  variable_selector:
                    - '1754600000005'
                    - result
              id: 'true'
              logical_operator: and
          desc: 检索结果非空 → RAG 回答；检索结果为空 → 闲聊兜底
          title: 检索判断
          type: if-else
        height: 126
        id: '1754600000006'
        position:
          x: 1296
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 7. LLM RAG 回答 ====================
      - data:
          context:
            enabled: true
            variable_selector:
              - '1754600000005'
              - result
          desc: 基于知识库检索结果进行 RAG 精准回答
          model:
            completion_params:
              temperature: 0.3
              top_p: 0.85
              max_tokens: 2048
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: prompt-rag-system
              role: system
              text: |
                # 角色
                你是「恒生智能办公助手 企业知识助手」，服务于金融企业内部的员工知识问答场景，专业、严谨、友好，专注于解答公司制度、流程规范、业务操作等问题。

                # 重要参数
                知识库检索结果：{{#context#}}

                # 技能
                ## 技能1：基于上下文解答
                严格依据上方知识库检索结果回答用户问题，答案必须有据可依。涉及制度条款、流程步骤、审批权限等关键信息时，优先直接引用原文要点。
                示例：用户问「差旅报销标准是什么？」，你应回答「根据《差旅费管理办法》第X条，交通标准：高铁二等座、飞机经济舱……」，并注明制度名称。

                ## 技能2：答案优化
                将检索到的零散内容整理为结构化回答：优先使用分点、编号步骤或表格呈现，语言简洁专业，避免照搬大段原文。

                ## 技能3：上下文不足时补齐
                若检索结果仅能部分回答，可结合通用常识谨慎补充，但必须明确标注「以下为通用做法，请以公司正式制度为准」；完全无相关内容时，如实告知并建议联系归口部门，不得编造制度条款或具体数字。

                ## 技能4：金融合规敏感处理
                涉及薪酬明细、客户信息、账户数据、监管处罚等敏感内容时，仅提供制度层面的公开说明，提醒用户遵守保密义务，并引导其通过正式渠道（如行政部、IT 支持分机 8000）办理。

                # 限制
                - 仅回答与企业办公、制度流程相关的问题，无关话题礼貌拒绝；
                - 不编造、不臆测，无法确认的信息明确说明；
                - 回答末尾注明信息来源的制度文档名称（若检索结果中有）。
            - id: prompt-rag-user
              role: user
              text: |
                用户输入问题：{{#sys.query#}}
          selected_features: []
          title: RAG回答
          type: llm
          vision:
            enabled: false
        height: 98
        id: '1754600000007'
        position:
          x: 1600
          y: 182
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 8. LLM 闲聊兜底 ====================
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 知识库未命中时的闲聊/通识兜底回答
          model:
            completion_params:
              temperature: 0.7
              top_p: 0.9
              max_tokens: 1024
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: prompt-chitchat-system
              role: system
              text: |
                你是「恒生智能办公助手 企业办公助手」，服务于金融企业内部员工。

                你的职责：
                1. 对于办公通识类问题（如办公软件使用技巧、职场礼仪、通用名词解释、效率方法等），给出清晰、实用、可操作的回答；
                2. 对于表述不明确或超出你掌握范围的问题，礼貌地请用户补充说明，或引导其联系相关部门（行政部 / IT 支持，分机 8000），不要生硬拒绝。

                回答要求：
                - 语气友好专业，条理清晰，适当使用分点；
                - 回答结尾必须注明「以上答案仅供参考」；
                - 禁止提及「知识库」「检索」「未检索到」等字样，不要向用户解释你的内部工作机制。
            - id: prompt-chitchat-user
              role: user
              text: |
                用户问题：{{#sys.query#}}
          selected_features: []
          title: 闲聊兜底回答
          type: llm
          vision:
            enabled: false
        height: 98
        id: '1754600000008'
        position:
          x: 1600
          y: 480
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 9. 直接回复 RAG 回答输出 ====================
      - data:
          answer: '{{#1754600000007.text#}}'
          desc: 输出 RAG 回答内容
          title: RAG回答输出
          type: answer
        height: 105
        id: '1754600000009'
        position:
          x: 1904
          y: 182
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 10. 直接回复 闲聊兜底输出 ====================
      - data:
          answer: '{{#1754600000008.text#}}'
          desc: 输出闲聊兜底回答内容
          title: 闲聊回答输出
          type: answer
        height: 105
        id: '1754600000010'
        position:
          x: 1904
          y: 480
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6
