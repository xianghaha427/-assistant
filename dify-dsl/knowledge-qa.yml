# FinPilot - 企业知识问答助手 DSL
# 用途：企业制度/流程/规范的知识问答
# 类型：Chatflow（对话型工作流）
# 工作流：开始 → 知识检索（Knowledge Retrieval）→ LLM → 结束
# 导入方式：Dify 工作室 → 创建应用 → 导入 DSL 文件
# 注意：导入后需在知识检索节点中配置实际的知识库
app:
  description: >-
    FinPilot 企业知识问答助手，专为金融企业员工提供企业内部制度、流程、规范等方面的问答服务。基于企业知识库进行精准回答。
  icon: "📚"
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 企业知识问答助手
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: 您好！我是 FinPilot 企业知识问答助手，可以为您解答企业内部制度、流程、规范等方面的问题。请问有什么可以帮您？
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 公司的请假流程是什么？
      - 报销制度有哪些要求？
      - 新员工入职需要哪些手续？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: knowledge-retrieval
        id: edge-start-to-knowledge
        source: node-start
        sourceHandle: source
        target: node-knowledge-retrieval
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: knowledge-retrieval
          targetType: llm
        id: edge-knowledge-to-llm
        source: node-knowledge-retrieval
        sourceHandle: source
        target: node-llm
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-to-end
        source: node-llm
        sourceHandle: source
        target: node-end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: 用户输入入口
          title: 开始
          type: start
          variables: []
        height: 54
        id: node-start
        position:
          x: 80
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          dataset_ids: []
          desc: 从企业知识库中检索相关制度、流程、规范内容
          multiple_retrieval_config:
            reranking_model:
              reranking_provider_name: ''
              reranking_model_name: ''
            top_k: 5
            score_threshold_enabled: false
            score_threshold: 0.5
          query_variable_selector:
            - sys
            - query
          retrieval_mode: multiple
          title: 知识检索
          type: knowledge-retrieval
        height: 54
        id: node-knowledge-retrieval
        position:
          x: 384
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: true
            variable_selector:
              - node-knowledge-retrieval
              - result
          desc: 基于知识库检索结果回答用户问题
          model:
            completion_params:
              temperature: 0.3
              top_p: 0.85
              max_tokens: 2048
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: system-prompt
              role: system
              text: >-
                你是 FinPilot 企业知识问答助手，专为金融企业员工提供企业内部制度、流程、规范等方面的问答服务。请基于知识库中的内容准确回答，如果知识库中没有相关信息，请明确告知用户。回答要简洁专业，必要时引用来源。
            - id: user-prompt
              role: user
              text: "以下是从企业知识库中检索到的相关内容：\n\n{{#context#}}\n\n用户问题：{{#sys.query#}}\n\n请基于以上知识库内容回答用户的问题。如果知识库中没有相关信息，请明确告知用户「抱歉，当前知识库中未找到相关信息，建议您联系相关部门获取准确信息。」"
          selected_features: []
          title: LLM
          type: llm
          vision:
            enabled: false
        height: 98
        id: node-llm
        position:
          x: 688
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 输出AI回答
          outputs:
            - value_selector:
                - node-llm
                - text
              variable: text
          title: 结束
          type: end
        height: 90
        id: node-end
        position:
          x: 992
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
