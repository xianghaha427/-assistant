    - data:
        code: "def main(query_text, extracted_text) -> dict:\n    text = str(query_text).strip() if query_text else \"\"\n    if text in (\"None\", \"null\", \"nil\"):\n        text = \"\"\n    extracted = str(extracted_text).strip() if extracted_text else \"\"\n    if extracted in (\"None\", \"null\", \"nil\"):\n        extracted = \"\"\n    if not text and not extracted:\n        return {\"merged_text\": \"\", \"invalid_message\": \"\\u274c \\u672a\\u63d0\\u4f9b\\u4efb\\u4f55\\u4f1a\\u8bae\\u5185\\u5bb9\\u3002\\u8bf7\\u7c98\\u8d34\\u4f1a\\u8bae\\u8f6c\\u5199\\u6587\\u672c\\uff0c\\u6216\\u4e0a\\u4f20\\u4f1a\\u8bae\\u6587\\u6863\\u3002\"}\n    final_text = extracted if extracted else text\n    return {\"merged_text\": final_text, \"invalid_message\": \"\"}"
