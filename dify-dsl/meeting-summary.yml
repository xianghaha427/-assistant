    - data:
        code: "import json\nimport re\n\n\ndef _esc(value):\n    \"\"\"表格单元格转义：竖线与换行\"\"\"\n    s = str(value) if value is not None else \"-\"\n    return s.replace(\"|\", \"\\\\|\").replace(\"\\r\\n\", \"\\n\").replace(\"\\n\", \"<br>\").strip() or \"-\"\n\n\ndef _is_inferred(value):\n    \"\"\"判断字段值是否为推断值（包含 [推断] 或为空）\"\"\"\n    if value is None:\n        return True\n    s = str(value).strip()\n    return s == \"\" or \"[推断]\" in s\n\n\ndef main(llm_text: str) -> dict:\n    \"\"\"\n    解析「结构化纪要生成」LLM 输出并格式化为 Markdown 纪要：\n    1. 第一层容错：直接 json.loads；\n    2. 第二层容错：正则提取最外层 {...} 后再解析；\n    3. 均失败则降级为原文输出 + 提示，不中断工作流。\n    返回：\n        result       - 完整 Markdown 纪要（或降级文案）\n        action_count - 待办事项数量（int）\n    \"\"\"\n    text = (llm_text or \"\").strip()\n    if not text:\n        return {\n            \"result\": \"⚠️ 纪要生成结果为空，请稍后重试或检查输入文本。\",\n            \"action_count\": 0,\n        }\n\n    # ---------- 双层容错解析 ----------\n    minutes = None\n    try:\n        obj = json.loads(text)\n        if isinstance(obj, dict):\n            minutes = obj\n    except (json.JSONDecodeError, ValueError):\n        pass\n    if minutes is None:\n        brace = re.search(r\"\\{.*\\}\", text, re.DOTALL)\n        if brace:\n            try:\n                obj = json.loads(brace.group(0))\n                if isinstance(obj, dict):\n                    minutes = obj\n            except (json.JSONDecodeError, ValueError):\n                pass\n    if minutes is None:\n        return {\n            \"result\": \"⚠️ 纪要结构化解析失败，以下为模型原始输出，可人工整理：\\n\\n\" + text,\n            \"action_count\": 0,\n        }\n\n    # ---------- 检测 LLM 返回的 error 字段（信息不足拒绝） ----------\n    if minutes.get(\"error\"):\n        return {\n            \"result\": \"⚠️ \" + str(minutes[\"error\"]),\n            \"action_count\": 0,\n        }\n\n    # ---------- 内容质量兜底检测 ----------\n    # 即使 LLM 没有走拒绝流程，如果核心内容为空，说明输入不是有效会议内容\n    # 判断标准：attendees 为空/推断 AND topics 为空 → 拒绝\n    # （一场真实会议至少有参会人和讨论议题，缺一不可）\n    attendees = minutes.get(\"attendees\")\n    has_real_attendees = isinstance(attendees, list) and any(\n        str(a).strip() and \"[推断]\" not in str(a) and \"未知\" not in str(a)\n        for a in attendees\n    )\n    topics = minutes.get(\"topics\") if isinstance(minutes.get(\"topics\"), list) else []\n    has_real_topics = any(\n        isinstance(t, dict) and str(t.get(\"topic\", \"\")).strip()\n        and \"[推断]\" not in str(t.get(\"topic\", \"\"))\n        for t in topics\n    )\n    if not has_real_attendees and not has_real_topics:\n        return {\n            \"result\": \"⚠️ 输入内容不足以生成会议纪要，请提供更完整的会议转写文本\"\n                      \"（建议包含发言人、讨论内容和结论）。\",\n            \"action_count\": 0,\n        }\n\n    # ---------- 格式化为 Markdown ----------\n    lines = []\n    title = str(minutes.get(\"title\") or \"[推断] 会议纪要\")\n    lines.append(\"# \" + title)\n    lines.append(\"\")\n    lines.append(\"**会议日期**：\" + str(minutes.get(\"date\") or \"[推断]\"))\n    if isinstance(attendees, list) and attendees:\n        lines.append(\"**参 会 人**：\" + \"、\".join(str(a) for a in attendees if str(a).strip()))\n    else:\n        lines.append(\"**参 会 人**：[推断] 原文未明确提及\")\n    lines.append(\"\")\n\n    lines.append(\"## \U0001F4CB 议题讨论\")\n    if topics:\n        lines.append(\"| 议题 | 讨论摘要 | 结论 |\")\n        lines.append(\"| --- | --- | --- |\")\n        for t in topics:\n            if not isinstance(t, dict):\n                continue\n            lines.append(\n                \"| \" + _esc(t.get(\"topic\"))\n                + \" | \" + _esc(t.get(\"discussion\"))\n                + \" | \" + _esc(t.get(\"conclusion\")) + \" |\"\n            )\n    else:\n        lines.append(\"原文未提炼出明确的议题讨论信息。\")\n    lines.append(\"\")\n\n    decisions = minutes.get(\"decisions\") if isinstance(minutes.get(\"decisions\"), list) else []\n    lines.append(\"## ✅ 会议决议\")\n    if decisions:\n        for d in decisions:\n            if str(d).strip():\n                lines.append(\"- \" + str(d).strip())\n    else:\n        lines.append(\"- 会议未形成明确决议\")\n    lines.append(\"\")\n\n    actions = minutes.get(\"action_items\") if isinstance(minutes.get(\"action_items\"), list) else []\n    lines.append(\"## \U0001F4CC 待办事项\")\n    if actions:\n        lines.append(\"| 内容 | 责任人 | 截止时间 | 状态 |\")\n        lines.append(\"| --- | --- | --- | --- |\")\n        for a in actions:\n            if not isinstance(a, dict):\n                continue\n            lines.append(\n                \"| \" + _esc(a.get(\"content\"))\n                + \" | \" + _esc(a.get(\"assignee\") or \"待指定\")\n                + \" | \" + _esc(a.get(\"deadline\") or \"待定\")\n                + \" | 待启动 |\"\n            )\n    else:\n        lines.append(\"未提取到待办事项。\")\n    lines.append(\"\")\n\n    risks = minutes.get(\"risks\") if isinstance(minutes.get(\"risks\"), list) else []\n    lines.append(\"## ⚠️ 风险提示\")\n    if risks:\n        for r in risks:\n            if str(r).strip():\n                lines.append(\"- \" + str(r).strip())\n    else:\n        lines.append(\"- 未识别到明确的风险信息\")\n\n    return {\n        \"result\": \"\\n\".join(lines),\n        \"action_count\": len([a for a in actions if isinstance(a, dict)]),\n    }"
        code_language: python3
        desc: 双层容错解析 LLM 输出的纪要 JSON，并格式化为 Markdown 纪要
        outputs:
          result:
            children: null
            type: string
          action_count:
            children: null
            type: number
        title: 解析与格式化
        type: code
        variables:
        - variable: llm_text
          value_selector:
          - '1754460000003'
          - text
