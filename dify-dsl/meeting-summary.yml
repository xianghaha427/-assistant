# FinPilot - 会议纪要助手 DSL
# 用途：接收会议转写文本，生成结构化会议纪要和待办事项
# 类型：Chatflow（对话型工作流）
# 工作流：开始 → LLM → 结束
# 导入方式：Dify 工作室 → 创建应用 → 导入 DSL 文件
app:
  description: >-
    FinPilot 会议纪要助手，接收会议转写文本，自动生成结构化的会议纪要，包含会议信息、议题摘要、决议事项和待办事项。
  icon: "📝"
  icon_background: '#E8F5E9'
  mode: advanced-chat
  name: 会议纪要助手
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: 您好！我是 FinPilot 会议纪要助手。请提供会议转写文本，我将为您生成结构化的会议纪要和待办事项。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: llm
        id: edge-start-to-llm
        source: node-start
        sourceHandle: source
        target: node-llm
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-to-end
        source: node-llm
        sourceHandle: source
        target: node-end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: 接收用户输入的会议转写文本
          title: 开始
          type: start
          variables: []
        height: 54
        id: node-start
        position:
          x: 80
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
          desc: 生成结构化会议纪要
          model:
            completion_params:
              temperature: 0.4
              top_p: 0.9
              max_tokens: 4096
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: system-prompt
              role: system
              text: "你是 FinPilot 会议纪要助手。请根据用户提供的会议转写文本，生成结构化的会议纪要，包含以下部分：\n\n1. 会议基本信息（标题、时间、参会人）\n2. 议题摘要（按议题分点总结）\n3. 决议事项\n4. 待办事项（格式：[责任人] 具体任务 | 截止时间）\n\n如果信息不完整，请基于上下文合理推断并标注。"
            - id: user-prompt
              role: user
              text: "请根据以下会议转写文本生成结构化的会议纪要：\n\n{{#sys.query#}}"
          selected_features: []
          title: LLM
          type: llm
          vision:
            enabled: false
        height: 98
        id: node-llm
        position:
          x: 384
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 输出会议纪要
          outputs:
            - value_selector:
                - node-llm
                - text
              variable: text
          title: 结束
          type: end
        height: 90
        id: node-end
        position:
          x: 688
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
