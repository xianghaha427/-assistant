    - data:
        code: "import re\n\n\ndef main(meeting_text: str) -> dict:\n    \"\"\"\n    文本质量校验：\n    1. strip 后长度须 >= 50；\n    2. 不能全是标点/数字（须存在有效文字）；\n    3. 须包含中文或英文字母。\n    返回：\n        valid           - 是否通过校验（bool）\n        invalid_reason  - 无效原因提示文案（valid 时为空串）\n        invalid_message - 无效分支完整回复文案（\"❌ \"+原因+引导文案），\n                          由「结束A」节点直接引用输出（end 节点不支持拼接）\n    \"\"\"\n    text = (meeting_text or \"\").strip()\n    valid = True\n    reason = \"\"\n\n    if len(text) < 50:\n        valid = False\n        reason = (\n            f\"会议文本长度仅 {len(text)} 字，不足 50 字最低要求，\"\n            \"无法有效提取会议要素\"\n        )\n    elif not re.sub(r\"[^\\u4e00-\\u9fa5A-Za-z]\", \"\", text):\n        valid = False\n        reason = \"会议文本全部为标点符号或数字，缺少实质性的文字内容\"\n    elif not re.search(r\"[\\u4e00-\\u9fa5A-Za-z]\", text):\n        valid = False\n        reason = \"会议文本未包含中文或英文内容，疑似无效输入\"\n\n    invalid_message = \"\"\n    if not valid:\n        invalid_message = (\n            \"❌ \" + reason\n            + \"。请粘贴完整的会议转写文本，建议50字以上，\"\n            \"包含发言人、讨论内容和结论。\"\n        )\n\n    return {\n        \"valid\": valid,\n        \"invalid_reason\": reason,\n        \"invalid_message\": invalid_message,\n    }"
        code_language: python3
        desc: 校验会议文本长度、文字有效性，并预组装无效分支回复文案
