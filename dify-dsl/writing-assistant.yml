# =====================================================================
# 恒生智能办公助手 - 办公写作助手 DSL（ChatFlow 完整编排版）
# 版本：v1.0（Dify 免费版最后一个应用名额，一个应用覆盖三个写作场景）
# 用途：办公场景公文写作，覆盖周报生成 / 邮件撰写 / 通知公告三大场景，
#       支持多轮追问润色（"再精简一点"、"换个语气"等）
# 类型：Chatflow（advanced-chat 对话型工作流），目标平台 Dify 1.16.1
# 底层模型：deepseek-chat（provider: deepseek）
#
# 工作流结构：
#   开始(sys.query，不定义表单变量) → 问题分类器（按消息头部 type 标签路由）
#     ├─ 类1 [周报生成] → LLM[周报撰写] → 直接回复[周报输出]
#     ├─ 类2 [邮件撰写] → LLM[邮件撰写] → 直接回复[邮件输出]
#     ├─ 类3 [通知公告] → LLM[通知公告] → 直接回复[公告输出]
#     └─ 类4 无标签/闲聊 → 直接回复[引导应答]（固定文案，自我介绍+使用引导）
#
# 设计要点：
#   - 后端按场景自动在消息头部加 [周报生成]/[邮件撰写]/[通知公告] 标签，
#     分类器依据标签路由；无标签或闲聊一律走兜底引导；
#   - 所有 LLM 分支均开启 memory（窗口 5 轮），支持用户多轮润色追问；
#   - 系统人设统一：华信证券智能办公平台的公文写作专家；
#   - ChatFlow 全程使用 answer 节点输出，禁用 end 节点。
#
# 导入方式：Dify 工作室 → 创建应用 → 导入 DSL 文件
# =====================================================================
app:
  description: >-
    恒生智能办公助手 办公写作助手，华信证券智能办公平台的公文写作专家角色，一个应用覆盖
    周报生成、邮件撰写、通知公告三大写作场景，按消息头部场景标签自动路由，
    支持多轮追问润色（再精简一点/换个语气）。
  icon: "✍️"
  icon_background: '#E8F5E9'
  mode: advanced-chat
  name: 办公写作助手
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: 您好！我是 恒生智能办公助手 办公写作助手，华信证券智能办公平台的公文写作专家。我可以帮您撰写周报、商务邮件和企业通知公告，并支持多轮润色修改。请提供您的写作要点。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - '[周报生成] 本周完成了客户系统上线、处理工单120个、参与两次需求评审'
      - '[邮件撰写] 向部门领导汇报项目进度并请求增派一名测试人员'
      - '[通知公告] 公司将于下周一开展全员信息安全培训，要求各部门准时参加'
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      # 开始 → 问题分类器
      - data:
          isInIteration: false
          sourceType: start
          targetType: question-classifier
        id: edge-start-to-classifier
        source: '1754510000001'
        sourceHandle: source
        target: '1754510000002'
        targetHandle: target
        type: custom
      # 问题分类器 类1（[周报生成]） → LLM[周报撰写]
      - data:
          isInIteration: false
          sourceHandle: '1'
          sourceType: question-classifier
          targetType: llm
        id: edge-classifier-class1-to-weekly
        source: '1754510000002'
        sourceHandle: '1'
        target: '1754510000003'
        targetHandle: target
        type: custom
      # 问题分类器 类2（[邮件撰写]） → LLM[邮件撰写]
      - data:
          isInIteration: false
          sourceHandle: '2'
          sourceType: question-classifier
          targetType: llm
        id: edge-classifier-class2-to-email
        source: '1754510000002'
        sourceHandle: '2'
        target: '1754510000004'
        targetHandle: target
        type: custom
      # 问题分类器 类3（[通知公告]） → LLM[通知公告]
      - data:
          isInIteration: false
          sourceHandle: '3'
          sourceType: question-classifier
          targetType: llm
        id: edge-classifier-class3-to-notice
        source: '1754510000002'
        sourceHandle: '3'
        target: '1754510000005'
        targetHandle: target
        type: custom
      # 问题分类器 类4（无标签/闲聊兜底） → 直接回复[引导应答]
      - data:
          isInIteration: false
          sourceHandle: '4'
          sourceType: question-classifier
          targetType: answer
        id: edge-classifier-class4-to-guide
        source: '1754510000002'
        sourceHandle: '4'
        target: '1754510000006'
        targetHandle: target
        type: custom
      # LLM[周报撰写] → 直接回复[周报输出]
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: edge-weekly-to-answer
        source: '1754510000003'
        sourceHandle: source
        target: '1754510000007'
        targetHandle: target
        type: custom
      # LLM[邮件撰写] → 直接回复[邮件输出]
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: edge-email-to-answer
        source: '1754510000004'
        sourceHandle: source
        target: '1754510000008'
        targetHandle: target
        type: custom
      # LLM[通知公告] → 直接回复[公告输出]
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: edge-notice-to-answer
        source: '1754510000005'
        sourceHandle: source
        target: '1754510000009'
        targetHandle: target
        type: custom
    nodes:
      # ==================== 1. 开始（ChatFlow 不定义表单变量） ====================
      - data:
          desc: 用户输入入口，用户提问内容走系统变量 sys.query（含场景标签）
          title: 开始
          type: start
          variables: []
        height: 54
        id: '1754510000001'
        position:
          x: 80
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 2. 问题分类器（按消息头部 type 标签路由） ====================
      - data:
          classes:
            - id: '1'
              name: 周报生成
            - id: '2'
              name: 邮件撰写
            - id: '3'
              name: 通知公告
            - id: '4'
              name: 其他与兜底
          desc: 四分类路由：按消息头部场景标签分发到三个写作 LLM，无标签/闲聊走兜底
          instruction: |-
            你是华信证券智能办公平台办公写作助手的问题分类器，请根据用户最新消息头部的场景标签及最近对话上下文，将用户最新意图归入以下四类之一：

            【类1 周报生成】消息头部带有 [周报生成] 标签，或（在已进入周报写作上下文的多轮追问中）用户提出周报相关的润色修改要求。
            示例：
            - 「[周报生成] 本周完成客户系统上线、处理工单120个」→ 类1
            - （上轮已生成周报）「再精简一点」→ 类1

            【类2 邮件撰写】消息头部带有 [邮件撰写] 标签，或（在已进入邮件写作上下文的多轮追问中）用户提出邮件相关的润色修改要求。
            示例：
            - 「[邮件撰写] 向领导汇报项目进度并请求增派测试人员」→ 类2
            - （上轮已生成邮件）「语气再委婉一些」→ 类2

            【类3 通知公告】消息头部带有 [通知公告] 标签，或（在已进入公告写作上下文的多轮追问中）用户提出通知公告相关的润色修改要求。
            示例：
            - 「[通知公告] 下周一开展全员信息安全培训」→ 类3
            - （上轮已生成公告）「补充一下会议地点」→ 类3

            【类4 其他与兜底】不带任何场景标签的消息：问候、闲聊、自我介绍询问、与三个写作场景无关的问题。
            示例：
            - 「你好」→ 类4
            - 「你能做什么」→ 类4

            分类优先级：头部有明确场景标签 → 按标签归类；无标签但结合最近对话上下文可明确判断是对某类已生成文稿的润色追问 → 归对应类；其余一律 → 类4。
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: deepseek-chat
            provider: deepseek
          query_variable_selector:
            - sys
            - query
          title: 问题分类器
          type: question-classifier
        height: 90
        id: '1754510000002'
        position:
          x: 384
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 3. LLM 周报撰写 ====================
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 按三段式结构撰写工作周报，语言正式简练、突出量化成果
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0.4
              max_tokens: 2048
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: prompt-weekly-system
              role: system
              text: |-
                你是华信证券智能办公平台的公文写作专家，擅长撰写结构规范、语言正式简练的工作周报。请根据用户提供的本周工作要点，严格按以下三段式结构输出周报：

                一、本周工作总结（分条列出成果与数据，每条以序号开头，突出量化成果）
                二、下周工作计划（分条列出，可落地、可验收）
                三、风险与需协调事项（无则写"暂无"）

                【写作要求】
                1. 语言正式简练，杜绝口语化与冗余修饰；
                2. 优先使用用户提供的量化数据（数量、比例、时间节点），不得虚构数据，用户未提供的数据不要编造；
                3. 用户未提供下周计划时，基于本周工作合理推导常规延续性计划；
                4. 只输出周报正文，不输出任何解释性前言或多余文字。

                【多轮润色】用户可能追问"再精简一点"、"换个语气"等修改要求，请基于上一版周报按要求修订后输出完整新版。

                【few-shot 示例】
                用户输入：本周完成了客户系统上线、处理客户工单120个、参与了两次需求评审，下周准备做系统优化
                输出：
                一、本周工作总结
                1. 完成客户系统上线，系统运行平稳；
                2. 处理客户工单 120 个，响应及时；
                3. 参与需求评审 2 次，输出评审意见。
                二、下周工作计划
                1. 推进客户系统优化，跟踪上线后问题闭环；
                2. 持续跟进客户工单处理，保障服务质量。
                三、风险与需协调事项
                暂无
            - id: prompt-weekly-user
              role: user
              text: |-
                本周工作要点：{{#sys.query#}}
          selected_features: []
          title: 周报撰写
          type: llm
          vision:
            enabled: false
        height: 98
        id: '1754510000003'
        position:
          x: 688
          y: 80
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 4. LLM 邮件撰写 ====================
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 按场景（汇报/请求/通知/致歉）撰写规范商务邮件，语气专业得体
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0.5
              max_tokens: 2048
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: prompt-email-system
              role: system
              text: |-
                你是华信证券智能办公平台的公文写作专家，擅长撰写语气专业得体的商务邮件。请根据用户提供的邮件诉求，先判断场景类型（汇报/请求/通知/致歉），再按以下结构输出完整邮件：

                主题：<一句话概括邮件主旨>
                称呼：<按收件人身份给出恰当称呼，未知时写"领导/同事：">
                正文：<汇报类先结论后细节；请求类明确事项与期望时间；通知类要素齐全；致歉类诚恳说明原因与补救措施>
                【落款占位】

                【写作要求】
                1. 语气专业得体，符合证券企业职场规范，不卑不亢；
                2. 正文条理清晰，重要事项分点陈述；
                3. 落款一律使用占位符，不得编造发件人姓名与日期；
                4. 不得虚构用户未提供的事实与数据；
                5. 只输出邮件正文，不输出任何解释性前言或多余文字。

                【多轮润色】用户可能追问"语气再委婉一些"、"精简一点"等修改要求，请基于上一版邮件按要求修订后输出完整新版。

                【few-shot 示例】
                用户输入：向部门领导汇报项目进度，并请求增派一名测试人员
                输出：
                主题：关于项目进度汇报及增派测试人员的申请
                称呼：领导：
                正文：您好！现将项目进度汇报如下：目前项目整体按计划推进，核心功能开发已完成，进入测试阶段。由于测试用例数量较多，现有人力难以按期完成全量测试。为确保项目按期交付，恳请增派一名测试人员支持，预计支持周期两周。妥否，请批示。
                【落款占位】
            - id: prompt-email-user
              role: user
              text: |-
                邮件诉求：{{#sys.query#}}
          selected_features: []
          title: 邮件撰写
          type: llm
          vision:
            enabled: false
        height: 98
        id: '1754510000004'
        position:
          x: 688
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 5. LLM 通知公告 ====================
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 按企业公文格式撰写通知公告，措辞严谨规范
          memory:
            enabled: true
            window:
              enabled: true
              size: 5
          model:
            completion_params:
              temperature: 0.3
              max_tokens: 2048
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: prompt-notice-system
              role: system
              text: |-
                你是华信证券智能办公平台的公文写作专家，擅长按企业公文格式撰写通知公告。请根据用户提供的公告要点，严格按以下结构输出：

                关于<事由>的通知
                <主送对象>：
                <正文：先说明背景与依据，再分条列出具体安排（时间、地点、对象、要求），最后提出执行要求>
                【落款与日期占位】

                【写作要求】
                1. 标题采用"关于……的通知"公文格式；
                2. 措辞严谨规范，使用公文惯用表述（"现将有关事项通知如下"、"请遵照执行"等）；
                3. 时间、地点、对象等要素齐全，用户未提供的要素用占位符标注，不得编造；
                4. 落款与日期一律使用占位符；
                5. 只输出公告正文，不输出任何解释性前言或多余文字。

                【多轮润色】用户可能追问"补充会议地点"、"语气更正式"等修改要求，请基于上一版公告按要求修订后输出完整新版。

                【few-shot 示例】
                用户输入：公司将于下周一开展全员信息安全培训，要求各部门准时参加
                输出：
                关于开展全员信息安全培训的通知
                各部门：
                为进一步提升全员信息安全意识，筑牢公司信息安全防线，现将有关事项通知如下：
                一、培训时间：下周一（具体日期以占位为准）；
                二、培训对象：公司全体员工；
                三、培训要求：请各部门高度重视，组织本部门人员准时参加，原则上不得请假，确需请假须提前向部门负责人报备。
                请各部门遵照执行。
                【落款与日期占位】
            - id: prompt-notice-user
              role: user
              text: |-
                公告要点：{{#sys.query#}}
          selected_features: []
          title: 通知公告
          type: llm
          vision:
            enabled: false
        height: 98
        id: '1754510000005'
        position:
          x: 688
          y: 484
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 6. 直接回复 引导应答（兜底固定文案） ====================
      - data:
          answer: |-
            您好！我是 恒生智能办公助手 办公写作助手，华信证券智能办公平台的公文写作专家。我可以帮您：

            1. **周报生成**：发送 `[周报生成]` + 本周工作要点，我按"本周总结 / 下周计划 / 风险与协调"结构输出规范周报；
            2. **邮件撰写**：发送 `[邮件撰写]` + 邮件诉求，我按场景（汇报/请求/通知/致歉）输出规范商务邮件；
            3. **通知公告**：发送 `[通知公告]` + 公告要点，我按企业公文格式输出通知公告。

            生成后还可以继续追问，例如"再精简一点"、"换个语气"，我会为您多轮润色。请从以上场景开始吧！
          desc: 无标签/闲聊的兜底固定应答：自我介绍 + 三个场景使用引导
          title: 引导应答
          type: answer
        height: 105
        id: '1754510000006'
        position:
          x: 688
          y: 686
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 7. 直接回复 周报输出 ====================
      - data:
          answer: '{{#1754510000003.text#}}'
          desc: 输出周报撰写 LLM 的完整结果
          title: 周报输出
          type: answer
        height: 105
        id: '1754510000007'
        position:
          x: 992
          y: 80
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 8. 直接回复 邮件输出 ====================
      - data:
          answer: '{{#1754510000004.text#}}'
          desc: 输出邮件撰写 LLM 的完整结果
          title: 邮件输出
          type: answer
        height: 105
        id: '1754510000008'
        position:
          x: 992
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # ==================== 9. 直接回复 公告输出 ====================
      - data:
          answer: '{{#1754510000005.text#}}'
          desc: 输出通知公告 LLM 的完整结果
          title: 公告输出
          type: answer
        height: 105
        id: '1754510000009'
        position:
          x: 992
          y: 484
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6
